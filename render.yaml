# Blueprint Render : base PostgreSQL + API Spring Boot (Docker)
databases:
  - name: banking-db
    databaseName: db_banking
    plan: free

services:
  - type: web
    name: banking-api
    runtime: docker
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        fromDatabase: { name: banking-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: banking-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: banking-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: banking-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: banking-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://banking-front.onrender.com
